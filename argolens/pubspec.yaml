name: argolens
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ပုံရွေးချယ်ရန်အတွက်
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.0
  image: ^4.1.3

  # API ပို့ရန်အတွက်
  http: ^1.6.0
  provider: ^6.1.1
  shared_preferences: ^2.3.1

  # ✨ Firebase နှင့် Native Google Sign-In အတွက် ပြင်ဆင်ချက်
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1

  flutter_dotenv: ^6.0.1
  cloud_firestore: ^5.6.12

  sqflite: ^2.3.0
  path: ^1.9.0
  geolocator: ^13.0.1
  intl: ^0.20.3
  firebase_messaging: ^15.2.10
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  gal: ^2.3.3
  socket_io_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # ✨ App Icon အတွက် ထည့်သွင်းရန်
  flutter_launcher_icons: ^0.14.2
  # ✨ Native Splash Screen အတွက် ထည့်သွင်းရန်
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  # .env ဖိုင်လမ်းကြောင်း နှင့် ပုံများအတွက်
  assets:
    - .env
    - assets/images/
    - assets/model/name.txt
    - assets/model/diseasemodel.tflite

# ✨ App Launcher Icon Configuration
flutter_launcher_icons:
  image_path: "assets/images/ic_launcher_foreground.png"
  android: true
  ios: true
  min_sdk_android: 21

# ✨ Native Splash Screen Configuration (App စဖွင့်ချိန် ပုံကြီးပေါ်ခြင်းကို ထိန်းချုပ်ရန်)
flutter_native_splash:
  color: "#121212"
  image: "assets/images/greatestofalltime.jpg"
  android: true
  ios: true
  android_12:
    color: "#121212"
    image: "assets/images/greatestofalltime.jpg"